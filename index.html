<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Acceso</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div>
        <h3>Acceso restringido</h3>
        <input
            type="password"
            id="clave"
            placeholder="Ingrese la clave"
        >
        <button onclick="validar()">Ingresar</button>
    </div>

    <script>
        function validar() {
            const clave = document.getElementById("clave").value;

            if (clave === "eva-0") {
                sessionStorage.setItem("auth", "ok");
                window.location.href = "e1-v2-g1-a.html";
            }
            else if (clave === "eva-b") {
                sessionStorage.setItem("auth", "ok");
                window.location.href = "e1-v2-g1-b.html";
            }
            else if (clave === "exa1") {
                sessionStorage.setItem("auth", "exa1");
                window.location.href = "exa/ex1-v1-g2.html";
            }

            else if (clave === "abc") {
                sessionStorage.setItem("auth", "abc");
                window.location.href = "exa/ex2-v1-gR.html";
            } else if (clave === "exa") {
                sessionStorage.setItem("auth", "exa2");
                window.location.href = "exa/ex1-v2-g2.html";
            } else if (clave === "recu2") {
                sessionStorage.setItem("auth", "recu2");
                window.location.href = "ppw-rec/evaluacion-rec.html";
            } else {
                alert("Clave incorrectaa");
            }
        }
    </script>

</body>

</html>
